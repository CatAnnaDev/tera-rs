[package]
name = "tera-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tera"
path = "src/main.rs"

[dependencies]
quick-xml = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tera-crypto = { workspace = true }
tera-datacenter = { workspace = true }
tera-index = { workspace = true }
tera-mapper = { workspace = true }
tera-mod = { workspace = true }
tera-package = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
memmap2 = { workspace = true }
rayon = { workspace = true }
libc = "0.2"
iced-x86 = { version = "1.21.0", default-features = false, features = ["std", "decoder", "intel"] }

[target.'cfg(target_os = "macos")'.dependencies]
mach2 = "0.4"
